apiVersion: v1
kind: Service
metadata:
  name: mcp-hub
  namespace: apps
  labels:
    app: mcp-hub
spec:
  selector:
    app: mcp-hub
  ports:
    - name: mcp
      port: 8083
      targetPort: mcp
      protocol: TCP
    - name: internal
      port: 8084
      targetPort: internal
      protocol: TCP
  type: ClusterIP
