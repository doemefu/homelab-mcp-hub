version: 2
updates:
  # Exact == pins in pyproject.toml + uv.lock; Dependabot updates both. New packages still need owner approval.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - "doemefu"
    open-pull-requests-limit: 5
    groups:
      mcp-sdk:
        patterns: ["mcp", "mcp-types", "starlette", "uvicorn", "pydantic*", "anyio", "httpx2", "httpcore2"]
      dev-tools:
        dependency-type: development

  # Actions are pinned by commit SHA with a version comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ["github/codeql-action*"]

  # Base images (python, uv builder) are pinned by tag + index digest. When the uv image moves,
  # bump setup-uv's `version:` in ci.yml/build.yml in the same PR.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
